name: Deploy Web Demo (GitHub Pages)

on:
  push:
    branches:
      - alpha
      - beta
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure pub.dev dependencies for Web demo
        run: |
          PUB_VER="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          python3 -c '
          import re, sys
          ver = sys.argv[1]
          with open("example/pubspec.yaml", "r") as f:
              content = f.read()
          content = re.sub(r"  libadwaitter:\n    path: [^\n]+", f"  libadwaitter: ^{ver}", content)
          content = re.sub(r"  adwaitter_icons:\n    path: [^\n]+", f"  adwaitter_icons: ^{ver}", content)
          with open("example/pubspec.yaml", "w") as f:
              f.write(content)
          ' "$PUB_VER"

      - name: Build Web/WASM demo
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --wasm --base-href /Libadwaitter/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
