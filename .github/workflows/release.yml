name: Release Demo App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (e.g. 1.0.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - stable
      number:
        description: 'Alpha/beta number (ignored for stable)'
        required: false
        default: '1'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      pub_version: ${{ steps.meta.outputs.pub_version }}
    steps:
      - name: Compute release name and type
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            APP_NAME="Adwaitter-${TAG}"
            if [[ "$TAG" == *"-stable" ]]; then
              PUB_VERSION="${TAG%-stable}"
            else
              PUB_VERSION="$(echo "$TAG" | sed -E 's/-(alpha|beta)-/-\1./')"
            fi
          else
            VER="${{ inputs.version }}"
            CHAN="${{ inputs.channel }}"
            NUM="${{ inputs.number }}"
            if [[ "$CHAN" == "stable" ]]; then
              APP_NAME="Adwaitter-${VER}-stable"
              PUB_VERSION="${VER}"
            else
              APP_NAME="Adwaitter-${VER}-${CHAN}-${NUM}"
              PUB_VERSION="${VER}-${CHAN}.${NUM}"
            fi
          fi

          if [[ "$APP_NAME" == *"-alpha-"* || "$APP_NAME" == *"-beta-"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "pub_version=${PUB_VERSION}" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: CarrsterX/Adwaitter
          path: packages/adwaitter

      - uses: actions/checkout@v4
        with:
          repository: CarrsterX/Adwaitter_Icons
          path: packages/adwaitter_icons

      - name: Install Linux dependencies for Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure pub.dev dependencies for release
        working-directory: example
        run: |
          PUB_VER="${{ needs.prepare.outputs.pub_version }}"
          python3 -c '
          import re, sys
          ver = sys.argv[1]
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          content = re.sub(r"  libadwaitter:\n    path: [^\n]+", f"  libadwaitter: ^{ver}", content)
          content = re.sub(r"  adwaitter_icons:\n    path: [^\n]+", f"  adwaitter_icons: ^{ver}", content)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          ' "$PUB_VER"

      - name: Build Linux release
        working-directory: example
        run: |
          flutter config --enable-windowing
          flutter pub get
          flutter build linux --release

      - name: Package .tar.gz
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          mkdir -p dist
          tar -czf "dist/${APP_NAME}-linux-x64.tar.gz" -C example/build/linux/x64/release/bundle .

      - name: Package .AppImage
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -r example/build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp example/web/icons/Icon-512.png "$APPDIR/com.carrster.adwaitter_demo.png"
          ln -sf com.carrster.adwaitter_demo.png "$APPDIR/.DirIcon"

          cat > "$APPDIR/com.carrster.adwaitter_demo.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Adwaitter Demo
          Comment=GNOME Libadwaita 1.10+ widget showcase for Flutter
          Exec=adwaitter_demo
          Icon=com.carrster.adwaitter_demo
          Categories=Development;Utility;GTK;
          StartupWMClass=com.carrster.adwaitter_demo
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/adwaitter_demo" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$APPDIR" "dist/${APP_NAME}-linux-x64.AppImage"
          chmod +x "dist/${APP_NAME}-linux-x64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: CarrsterX/Adwaitter
          path: packages/adwaitter

      - uses: actions/checkout@v4
        with:
          repository: CarrsterX/Adwaitter_Icons
          path: packages/adwaitter_icons

      - name: Install OpenJDK 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure pub.dev dependencies for release
        working-directory: example
        run: |
          PUB_VER="${{ needs.prepare.outputs.pub_version }}"
          python3 -c '
          import re, sys
          ver = sys.argv[1]
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          content = re.sub(r"  libadwaitter:\n    path: [^\n]+", f"  libadwaitter: ^{ver}", content)
          content = re.sub(r"  adwaitter_icons:\n    path: [^\n]+", f"  adwaitter_icons: ^{ver}", content)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          ' "$PUB_VER"

      - name: Build APKs per ABI
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          OUT_DIR="example/build/app/outputs/flutter-apk"
          mkdir -p dist
          cp "${OUT_DIR}/app-armeabi-v7a-release.apk" "dist/${APP_NAME}-android-arm.apk"
          cp "${OUT_DIR}/app-arm64-v8a-release.apk" "dist/${APP_NAME}-android-arm64.apk"
          cp "${OUT_DIR}/app-x86_64-release.apk" "dist/${APP_NAME}-android-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk

  release:
    needs: [prepare, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes body
        env:
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
          PUB_VERSION: ${{ needs.prepare.outputs.pub_version }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          app_name = os.environ["APP_NAME"]
          pub_version = os.environ["PUB_VERSION"]
          current_tag = os.environ["CURRENT_TAG"]

          # Detect channel (alpha / beta / stable)
          lower_name = app_name.lower()
          is_alpha = "-alpha-" in lower_name or "-alpha." in lower_name
          is_beta = "-beta-" in lower_name or "-beta." in lower_name

          parts = []

          if is_alpha:
              parts.append(
                  "> [!WARNING]\n"
                  "> **Pre-release / Alpha Software:** This is an early development build and is **not stable**. "
                  "APIs, widgets, and behaviors may change without notice, and bugs or incomplete features are expected. "
                  "Do not use in production."
              )
              feedback_label = "this alpha"
          elif is_beta:
              parts.append(
                  "> [!WARNING]\n"
                  "> **Pre-release / Beta Software:** This is a beta testing build. "
                  "APIs are stabilizing, but bugs or visual polish issues may still occur. "
                  "Please test thoroughly before using in production."
              )
              feedback_label = "this beta"
          else:
              feedback_label = "this release"

          # Extract current version section from CHANGELOG.md
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  changelog = f.read()
              pattern = rf"^##\s+{re.escape(pub_version)}\s*\n(.*?)(?=^##\s+|\Z)"
              m = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
              if m and m.group(1).strip():
                  parts.append("### 📋 What's Changed\n" + m.group(1).strip())

          # Compute Full Changelog compare URL against previous tag
          tags = subprocess.check_output(
              ["git", "tag", "--sort=-v:refname"], text=True
          ).splitlines()
          prev_tag = None
          if current_tag in tags:
              idx = tags.index(current_tag)
              if idx + 1 < len(tags):
                  prev_tag = tags[idx + 1]
          elif tags:
              prev_tag = tags[0]

          if prev_tag:
              parts.append(
                  f"**Full Changelog**: https://github.com/CarrsterX/Libadwaitter/compare/{prev_tag}...{current_tag}"
              )

          parts.append(
              "### 📥 Demo App Downloads\n"
              f"- **Linux (x64):** `{app_name}-linux-x64.tar.gz`\n"
              f"- **Linux (x64):** `{app_name}-linux-x64.AppImage`\n"
              f"- **Android (arm64-v8a):** `{app_name}-android-arm64.apk`\n"
              f"- **Android (armeabi-v7a):** `{app_name}-android-arm.apk`\n"
              f"- **Android (x86_64):** `{app_name}-android-x86_64.apk`"
          )

          parts.append(
              "### 🌐 WebAssembly Demo App\n"
              "- **Web:** https://carrsterx.github.io/Libadwaitter/"
          )

          parts.append(
              "### 🧪 Feedback\n"
              f"If you test {feedback_label} and find any issues, please report them in the "
              "[Issues](https://github.com/CarrsterX/Libadwaitter/issues) tab."
          )

          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write("\n\n".join(parts) + "\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.app_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body_path: release_body.md
          files: artifacts/*
