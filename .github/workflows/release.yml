name: Release Demo App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión X.Y.Z (ej. 0.1.0)'
        required: true
        type: string
      channel:
        description: 'Tipo de release'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - stable
      number:
        description: 'Número de alpha/beta (ignorado en stable)'
        required: false
        default: '1'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Calcular nombre y tipo de release
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            APP_NAME="Adwaitter-${TAG}"
          else
            VER="${{ inputs.version }}"
            CHAN="${{ inputs.channel }}"
            NUM="${{ inputs.number }}"
            if [[ "$CHAN" == "stable" ]]; then
              APP_NAME="Adwaitter-${VER}-stable"
            else
              APP_NAME="Adwaitter-${VER}-${CHAN}-${NUM}"
            fi
          fi

          if [[ "$APP_NAME" == *"-alpha-"* || "$APP_NAME" == *"-beta-"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de Linux para Flutter
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compilar Linux release
        working-directory: example
        run: |
          flutter pub get
          flutter build linux --release

      - name: Empaquetar .tar.gz
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          mkdir -p dist
          tar -czf "dist/${APP_NAME}-linux-x64.tar.gz" -C example/build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/*.tar.gz

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compilar APKs por arquitectura
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Renombrar APKs
        run: |
          APP_NAME="${{ needs.prepare.outputs.app_name }}"
          OUT_DIR="example/build/app/outputs/flutter-apk"
          mkdir -p dist
          cp "${OUT_DIR}/app-armeabi-v7a-release.apk" "dist/${APP_NAME}-android-arm.apk"
          cp "${OUT_DIR}/app-arm64-v8a-release.apk" "dist/${APP_NAME}-android-arm64.apk"
          cp "${OUT_DIR}/app-x86_64-release.apk" "dist/${APP_NAME}-android-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk

  release:
    needs: [prepare, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.app_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*
