name: libadwaitter
description: A pure Dart and Flutter implementation of GNOME's Libadwaita design system, following the GNOME Human Interface Guidelines (HIG).
version: 0.1.0
# Local monorepo development uses path dependencies; remove publish_to and switch to hosted versions before publishing.
publish_to: 'none'
homepage: https://github.com/CarrsterX/Libadwaitter
repository: https://github.com/CarrsterX/Libadwaitter
issue_tracker: https://github.com/CarrsterX/Libadwaitter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

executables:
  setup: setup

dependencies:
  flutter:
    sdk: flutter
  adwaitter:
    path: packages/adwaitter
  fluttpak:
    path: packages/fluttpak
  snaptter:
    path: packages/snaptter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false

