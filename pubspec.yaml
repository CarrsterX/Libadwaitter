name: libadwaitter
description: A pure Dart and Flutter implementation of GNOME's Libadwaita design system, following the GNOME Human Interface Guidelines (HIG).
version: 0.1.0
homepage: https://github.com/CarrsterX/Libadwaitter
repository: https://github.com/CarrsterX/Libadwaitter
issue_tracker: https://github.com/CarrsterX/Libadwaitter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

executables:
  setup: setup

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false

  fonts:
    - family: AdwaitaSans
      fonts:
        - asset: assets/fonts/AdwaitaSans-Regular.ttf
        - asset: assets/fonts/AdwaitaSans-Italic.ttf
          style: italic
    - family: AdwaitaMono
      fonts:
        - asset: assets/fonts/AdwaitaMono-Regular.ttf
        - asset: assets/fonts/AdwaitaMono-Bold.ttf
          weight: 700

