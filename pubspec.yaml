name: libadwaitter
description: A pure Dart and Flutter implementation of GNOME's Libadwaita design system, following the GNOME Human Interface Guidelines (HIG).
version: 1.0.0-alpha.6
homepage: https://github.com/CarrsterX/Libadwaitter
repository: https://github.com/CarrsterX/Libadwaitter
issue_tracker: https://github.com/CarrsterX/Libadwaitter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.50.0'

executables:
  setup: setup

dependencies:
  flutter:
    sdk: flutter
  adwaitter: ^1.0.0-alpha.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false
  plugin:
    platforms:
      android:
        dartPluginClass: LibadwaitterDartPlugin
      linux:
        dartPluginClass: LibadwaitterDartPlugin

